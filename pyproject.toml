[project]
name = "deauville"
version = "0.1.0"
description = "Deauville Festival du Rire: the programme, its rules, a command line and a web API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
deauville = "deauville.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
